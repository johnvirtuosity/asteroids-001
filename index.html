<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pure JS Asteroid Dodger</title>
  <style>
    body {
      background-color: #222;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    canvas {
      background: #111;
      border: 3px solid #444;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { margin-bottom: 5px; }
    p { margin-top: 0; color: #aaa; }
  </style>
</head>
<body>

  <h1>Asteroid Dodger</h1>
  <!-- <p>Use Arrow Keys to move. Avoid the red blocks!</p> -->
  <p>Use W (Up), X (Down), J (Left), and L (Right) to move. Avoid the red blocks!</p>


  <!-- HTML5 Canvas Elements -->
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <!-- Load your pure JS files sequentially. Order matters! -->
  <script src="input.js"></script>
  <script src="game.js"></script>
</body>
</html>
